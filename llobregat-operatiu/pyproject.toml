[project]
name = "llobregat-operatiu"
version = "1.0.0"
description = "Live flood forecast for the Llobregat River at Sant Joan Despí, every 30 minutes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joan Gordó Guardia" }]
requires-python = ">=3.12"
dependencies = [
    "llobregat-flood-forecasting[models] @ git+https://github.com/joangordo/llobregat-flood-forecasting@v1.0.0",
    # Same versions that trained the model in model/ (manifest.json → versions): the Ridge
    # pipelines are pickled and must be loaded with the scikit-learn that saved them
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
